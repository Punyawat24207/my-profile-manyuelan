<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Manyuelan</title>

  <!-- FONT -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;700&display=swap" rel="stylesheet">

  <!-- ICON -->
  <script src="https://kit.fontawesome.com/7d62f5a6f3.js" crossorigin="anonymous"></script>

<style>

/* =======================
   RESET
======================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Noto Sans Thai',sans-serif;
}

/* =======================
   BODY
======================= */

body{
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow:hidden;
    position:relative;

    background:
    linear-gradient(
        to bottom,
        #e7a06b 0%,
        #c29572 35%,
        #8f867f 70%,
        #747474 100%
    );
}

/* =======================
   FOG
======================= */

body::before{
    content:"";
    position:absolute;

    width:100%;
    height:100%;

    background:
    radial-gradient(circle at 20% 20%, rgba(255,255,255,0.08), transparent 25%),
    radial-gradient(circle at 80% 10%, rgba(255,255,255,0.05), transparent 30%),
    radial-gradient(circle at 50% 80%, rgba(255,255,255,0.05), transparent 30%);

    filter:blur(80px);
}

/* =======================
   STARS
======================= */

.stars{
    position:absolute;
    width:100%;
    height:100%;
}

.stars span{
    position:absolute;

    width:2px;
    height:2px;

    background:white;
    border-radius:50%;

    animation:twinkle 3s infinite alternate;
}

@keyframes twinkle{
    from{
        opacity:0.2;
    }

    to{
        opacity:1;
    }
}

/* =======================
   CLOUD
======================= */

.cloud{
    position:absolute;
    bottom:-100px;

    width:120%;
    height:260px;

    background:
    radial-gradient(circle at 20% 20%, rgba(255,255,255,0.14), transparent 25%),
    radial-gradient(circle at 50% 30%, rgba(255,255,255,0.08), transparent 30%),
    radial-gradient(circle at 80% 20%, rgba(255,255,255,0.12), transparent 25%);

    filter:blur(40px);
}

/* =======================
   CONTAINER
======================= */

.container{
    position:relative;
    z-index:2;

    width:100%;
    max-width:720px;

    text-align:center;
    color:white;

    padding:20px;
}

/* =======================
   AVATAR
======================= */

.avatar-box{
    margin-bottom:24px;
}

.avatar-ring{
    width:120px;
    height:120px;

    margin:auto;
    padding:5px;

    border-radius:50%;

    border:2px solid rgba(255,255,255,0.35);

    box-shadow:
    0 0 25px rgba(140,220,255,0.25);
}

.avatar{
    width:100%;
    height:100%;

    object-fit:cover;
    border-radius:50%;
}

/* =======================
   TEXT
======================= */

h1{
    font-size:72px;
    font-weight:700;

    margin-bottom:12px;

    text-shadow:
    0 0 20px rgba(180,230,255,0.4);
}

.cn{
    font-size:18px;
    margin-bottom:10px;

    opacity:0.9;
}

.th{
    font-size:18px;
    line-height:1.8;

    opacity:0.95;
}

/* =======================
   GLASS CARD
======================= */

.card{
    margin-top:40px;

    padding:30px;

    border-radius:30px;

    background:
    rgba(255,255,255,0.08);

    border:1px solid rgba(255,255,255,0.18);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    box-shadow:
    0 10px 40px rgba(0,0,0,0.25);
}

/* =======================
   BUTTON
======================= */

.link{
    display:flex;
    justify-content:space-between;
    align-items:center;

    text-decoration:none;
    color:white;

    padding:22px 28px;
    margin-bottom:18px;

    border-radius:20px;

    background:
    rgba(255,255,255,0.06);

    border:1px solid rgba(255,255,255,0.12);

    transition:0.3s;
}

.link:hover{
    transform:
    translateY(-4px)
    scale(1.01);

    background:
    rgba(255,255,255,0.12);

    box-shadow:
    0 0 20px rgba(140,220,255,0.15);
}

.left{
    font-size:20px;
    font-weight:500;
}

.right{
    font-size:26px;
}

/* =======================
   MOBILE
======================= */

@media(max-width:768px){

    h1{
        font-size:50px;
    }

    .left{
        font-size:17px;
    }

    .th{
        font-size:16px;
    }

    .card{
        padding:20px;
    }

}

</style>
</head>

<body>

  <!-- ดาว -->
  <div class="stars">
    <span style="top:10%; left:20%;"></span>
    <span style="top:20%; left:70%;"></span>
    <span style="top:40%; left:50%;"></span>
    <span style="top:65%; left:15%;"></span>
    <span style="top:80%; left:80%;"></span>
  </div>

  <!-- เมฆ -->
  <div class="cloud"></div>

  <!-- CONTENT -->
  <div class="container">

    <!-- Avatar -->
    <div class="avatar-box">
      <div class="avatar-ring">
        <img src="376_20260522181108.png" class="avatar">
      </div>
    </div>

    <!-- Title -->
    <h1>满月澜</h1>

    <!-- Text -->
    <div class="cn">
      认识你很高兴，我名为满月澜
    </div>

    <div class="th">
      ข้าคือผู้เดินทางแห่งจันทราและสายหมอก นามของข้า คือ หม่านเยว่หลาน<br>
      ยินดีที่ได้รู้จัก... ฝากตัวด้วยนะ
    </div>

    <!-- CARD -->
    <div class="card">

      <a href="https://youtube.com/@manyuelan?si=V_FqMNDiHbEaIxfz" class="link">
        <div class="left">YouTube</div>
        <div class="right">
          <i class="fa-brands fa-youtube"></i>
        </div>
      </a>

      <a href="https://www.tiktok.com/@_manyuelan_" class="link">
        <div class="left">TikTok</div>
        <div class="right">
          <i class="fa-brands fa-tiktok"></i>
        </div>
      </a>

      <a href="https://docs.google.com/forms/d/e/1FAIpQLSeIvBc_8a1UN9avKEpR3CXMxUT-RgPRbi090wjr6JL6sbZiiw/viewform?usp=dialog" class="link">
        <div class="left">Fanart</div>
        <div class="right">
          <i class="fa-solid fa-paintbrush"></i>
        </div>
      </a>

      <a href="https://ezdn.app/manyuelan" class="link">
        <div class="left">Donate</div>
        <div class="right">
          <i class="fa-solid fa-heart"></i>
        </div>
      </a>

    </div>

  </div>

<script>

/* =======================
   ดาวสุ่ม
======================= */

const stars = document.querySelector('.stars');

for(let i = 0; i < 60; i++){

    const star = document.createElement('span');

    star.style.top = Math.random() * 100 + '%';
    star.style.left = Math.random() * 100 + '%';

    star.style.animationDelay =
    Math.random() * 3 + 's';

    star.style.opacity =
    Math.random();

    stars.appendChild(star);

}

/* =======================
   เอฟเฟกต์ลอย
======================= */

const card = document.querySelector('.card');

document.addEventListener('mousemove',(e)=>{

    let x =
    (window.innerWidth / 2 - e.pageX) / 40;

    let y =
    (window.innerHeight / 2 - e.pageY) / 40;

    card.style.transform =
    `rotateY(${x}deg) rotateX(${-y}deg)`;

});

</script>

</body>
</html>
